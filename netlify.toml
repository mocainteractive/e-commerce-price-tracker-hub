# Configurazione Netlify per l'app integrata Moca Hub "Price Tracker".
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # URL dell'Hub: l'SDK lo usa per validare il launch token dal browser.
  VITE_MOCA_HUB_URL = "https://moca-central-hub.netlify.app"
  NODE_VERSION = "20"

# Ogni funzione e' progettata per stare nei ~10 secondi standard: il lavoro
# lungo (import, scansioni) e' spezzato in lotti orchestrati dal browser, che
# non ha limiti di durata. Nessun timeout esteso da richiedere alla piattaforma.
[functions]
  node_bundler = "esbuild"
  # Le utility condivise non sono endpoint: restano fuori dal deploy come funzioni.
  included_files = ["netlify/functions/utils/**"]

# Scansione automatica giornaliera (06:00 UTC) per i clienti che l'hanno attivata.
[functions."scheduled-scan"]
  schedule = "0 6 * * *"

# Alias comodo: /api/* -> funzioni Netlify dell'app.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# SPA fallback: tutte le altre route servono index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
